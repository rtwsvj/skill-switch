# skill-switch 可复用 GitHub Action
# 在别的仓库的 CI 里跑 `skill-switch audit`,把 AI agent skills / MCP 配置里的危险模式
# (反弹 shell、外传敏感文件、钓鱼式索要凭据、危险 MCP server、明文远程传输……)
# 扫出来,并可把 SARIF 上传到 GitHub code-scanning。
#
# 所有调用方输入只经环境变量进入固定 Node wrapper。wrapper 以 shell:false
# 和 argv 数组启动 npx，输入不会被解释为 shell 源码。
name: 'skill-switch audit'
description: '审计 AI agent skills 与 MCP/agent 配置中的危险模式,可上传 SARIF 到 GitHub code-scanning。'
author: 'rtwsvj'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: '要审计的路径(默认仓库根)'
    required: false
    default: '.'
  args:
    description: '额外 audit 参数；引号和反斜杠仅用于 argv 分组，不执行 shell 展开。'
    required: false
    default: '--configs'
  version:
    description: '精确的 skill-switch npm 版本；默认与本 Action release 固定一致。'
    required: false
    default: '0.9.0'
  node-version:
    description: '运行所用的 Node 版本'
    required: false
    default: '20'
  format:
    description: '输出格式:human | json | sarif | github。'
    required: false
    default: 'sarif'
  output:
    description: '仓库内的相对输出路径(非 github 格式使用)'
    required: false
    default: 'skill-switch.sarif'
  upload-sarif:
    description: 'format=sarif 时是否把结果上传到 GitHub code-scanning'
    required: false
    default: 'true'
  fail-on-findings:
    description: '审计返回非零退出码时是否让本步骤失败'
    required: false
    default: 'true'

outputs:
  exit-code:
    description: 'skill-switch audit 的退出码(0=无阻断)'
    value: ${{ steps.audit.outputs.exit-code }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run skill-switch audit
      id: audit
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        SKILL_SWITCH_PATH: ${{ inputs.path }}
        SKILL_SWITCH_ARGS: ${{ inputs.args }}
        SKILL_SWITCH_VERSION: ${{ inputs.version }}
        SKILL_SWITCH_FORMAT: ${{ inputs.format }}
        SKILL_SWITCH_OUTPUT: ${{ inputs.output }}
      run: |
        node "${GITHUB_ACTION_PATH}/scripts/github-action-audit.mjs"

    - name: Upload SARIF to code-scanning
      if: ${{ inputs.format == 'sarif' && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@641a925cfafe92d0fdf8b239ba4053e3f8d99d6d # v3
      with:
        sarif_file: ${{ inputs.output }}

    - name: Fail on findings
      if: ${{ inputs.fail-on-findings == 'true' }}
      shell: bash
      env:
        AUDIT_EXIT_CODE: ${{ steps.audit.outputs.exit-code }}
      run: |
        if [[ ! "$AUDIT_EXIT_CODE" =~ ^[0-9]+$ ]]; then
          echo "::error::skill-switch audit returned an invalid exit code."
          exit 2
        fi
        if [ "$AUDIT_EXIT_CODE" != "0" ]; then
          echo "::error::skill-switch audit found blocking issues (exit code $AUDIT_EXIT_CODE)."
          exit 1
        fi
        echo "skill-switch audit passed with no blocking issues."
