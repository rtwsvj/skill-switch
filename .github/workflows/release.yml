# 原生 macOS App 发布流水线:git tag 推送时触发,在 macos-14 runner 上
#   checkout → pnpm install → pnpm test → bash macos/build-app.sh
#   → ditto -c -k --keepParent 打 zip → 作为 asset 上传到该 tag 的 GitHub Release。
#
# 重要(诚实写明):本流水线只产出【未签名】的 .app 包供预览与试用。
# 真正的 Developer ID 签名 + Apple 公证仍由维护者在本地执行 macos/sign-notarize.sh,
# Apple 凭据不进 CI(Apple Developer Program $99/年的认证证书不进仓库 secrets,
# CI 也跑不了需要交互 keychain 的 codesign --options runtime + notarytool)。
# 维护者本地签完后再覆盖上传到同一 tag 的 Release。
#
# 为什么不再走 tauri-action / Windows / Linux 矩阵?
#   Tauri GUI 已退役(参见 CHANGELOG Unreleased 与 macos/README),Linux/Windows
#   用户继续走 npm CLI(`npx @rtwsvj/skill-switch`),桌面 App 只发 macOS。

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write   # 上传 Release 产物需要
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test && pnpm typecheck

      - name: Build unsigned skill-switch.app
        run: bash macos/build-app.sh

      - name: Zip the .app bundle
        run: |
          cd macos/dist
          ditto -c -k --keepParent skill-switch.app skill-switch.app.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'skill-switch ${{ github.ref_name }}'
          body: |
            ## skill-switch ${{ github.ref_name }}

            ### 安装(macOS,Apple Silicon)

            **未签名包(本 CI 产物,供预览试用)**
            下载 `skill-switch.app.zip`,解压后把 `skill-switch.app` 拖进「应用程序」。
            首次打开若被 Gatekeeper 拦截,在「系统设置 → 隐私与安全性」点「仍要打开」。

            **正式签名 + 公证包**
            由维护者本地跑 `macos/sign-notarize.sh` 后覆盖上传到本 Release。
            签名公证版的 `skill-switch_<ver>_aarch64.dmg` 双击即可直接打开,不会被 Gatekeeper 拦截。

            ### CLI(npm)

            ```bash
            npx @rtwsvj/skill-switch --help
            ```

            See [CHANGELOG.md](https://github.com/rtwsvj/skill-switch/blob/main/CHANGELOG.md) for details.
          draft: false
          prerelease: false
          files: |
            macos/dist/skill-switch.app.zip
