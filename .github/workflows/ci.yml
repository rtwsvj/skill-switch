name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Coverage executes the complete Vitest suite, so running `pnpm test`
      # immediately before it only doubles CI time without adding evidence.
      - name: Test and coverage gate
        run: pnpm test:coverage

  # 原生 macOS App 自检:编译 SwiftUI + i18n 资源完整性。Tauri 已退役,
  # 不再跑 gui 的 build/i18n:check。产物签名仍走 macos/sign-notarize.sh 由维护者本地手跑。
  # swift build 与 check-i18n.sh 均不依赖 Node/pnpm,此 job 不装依赖(完整打包在 release.yml)。
  macos-app:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build SwiftUI app
        working-directory: macos
        run: swift test && swift build

      - name: i18n completeness check
        working-directory: macos
        run: bash scripts/check-i18n.sh
