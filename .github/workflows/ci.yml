name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # 带阈值门禁的覆盖率检查:thresholds 在 vitest.config.ts 声明,低于下限则失败。
      # 阈值保守(比实测低 2-3%),防倒退而非一步到位高覆盖。
      - name: Coverage gate
        run: pnpm test:coverage

  # 原生 macOS App 自检:编译 SwiftUI + i18n 资源完整性。Tauri 已退役,
  # 不再跑 gui 的 build/i18n:check。产物签名仍走 macos/sign-notarize.sh 由维护者本地手跑。
  # swift build 与 check-i18n.sh 均不依赖 Node/pnpm,此 job 不装依赖(完整打包在 release.yml)。
  macos-app:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build SwiftUI app
        working-directory: macos
        run: swift build

      - name: i18n completeness check
        working-directory: macos
        run: bash scripts/check-i18n.sh
